name: ATM Device Locator Monitoring

on:
  schedule:
    # Berjalan otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan untuk dijalankan secara manual kapan saja

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install playwright requests
        playwright install chromium

    - name: Run Monitoring Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SESSION_DATA: ${{ secrets.SESSION_DATA }}
        PORTAL_USER: ${{ secrets.PORTAL_USER }}
        PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
        URL_LOGIN: ${{ secrets.URL_LOGIN }}
        URL_MONITORING: ${{ secrets.URL_MONITORING }}
      run: |
        python main.py
